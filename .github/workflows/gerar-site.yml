name: Gerar site para Hostinger

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar site
        run: npm run build

      - name: Configurar endereços da Hostinger
        run: |
          cat > dist/.htaccess <<'EOF'
          DirectoryIndex index.html
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^ index.html [L]
          </IfModule>
          EOF

      - name: Disponibilizar ZIP
        uses: actions/upload-artifact@v4
        with:
          name: site-hostinger
          path: dist/
          include-hidden-files: true
